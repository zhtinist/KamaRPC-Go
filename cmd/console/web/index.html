<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KamaRPC 控制台</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="title">
    <h1>KamaRPC 控制台</h1>
    <span class="sub">服务拓扑 · 吞吐 · 延迟 · 运行状态</span>
  </div>
  <div class="controls">
    <label>刷新间隔
      <select id="interval">
        <option value="1000" selected>1s</option>
        <option value="2000">2s</option>
        <option value="5000">5s</option>
      </select>
    </label>
    <button id="toggle" class="btn">暂停</button>
    <span id="status" class="status">连接中…</span>
  </div>
</header>

<main>
  <section class="cards" id="summary"></section>

  <section class="panel">
    <h2>总 QPS<span class="hint">按两次采样之间的调用增量计算</span></h2>
    <canvas id="qpsChart" height="140"></canvas>
  </section>

  <div class="grid">
    <section class="panel">
      <h2>服务拓扑<span class="hint">来自 etcd，实例上下线会实时反映</span></h2>
      <div id="topology"></div>
    </section>

    <section class="panel">
      <h2>服务端实例<span class="hint">连接数 / 协程数 / 运行时长</span></h2>
      <div id="targets"></div>
    </section>
  </div>

  <section class="panel">
    <h2>方法级指标<span class="hint">延迟分位数由服务端直方图近似得出</span></h2>
    <div id="methods"></div>
  </section>
</main>

<footer>
  数据来源：<code>/api/overview</code> —— etcd 服务发现 + 各服务端 <code>/stats</code> 只读指标接口
</footer>

<script src="app.js"></script>
</body>
</html>
